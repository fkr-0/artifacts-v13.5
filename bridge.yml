version: 1
name: artifacts-v13.5
description: "Recovery/convergence release of artifacts.fkr.dev: sanitized V12
  launcher UX with full portfolio assembly and V13 provenance/integrity
  hardening."
default_track: local
shell: true
sync_dir:
  - .

agent:
  notes: |
    Project created by ws-bridge create_project. Keep bridge.yml commands runnable from the project root.
  tasks: []
  changelog:
    - Initialized project scaffold.

commands:
  dev:
    description: Run the development entrypoint
    category: dev
    cwd: .
    run: [ "npm", "run", "dev" ]

  test:
    description: Run tests
    category: test
    cwd: .
    run: [ "npm", "test" ]

  build:
    description: Run the build command
    category: build
    cwd: .
    run: [ "npm", "run", "build" ]
agent_workflow:
  version: "1.0"
  project:
    id: artifacts-v13.5
    title: artifacts-v13.5
    root: .
    capacity:
      max_active_workers: 4
      max_reserved_packets: 8
      max_reviewers: 2
  defaults:
    queue: managed
    lease_policy: normal
    mutation_policy: transactional
    review_policy: independent-review
    priority: 50
  lease_policies:
    normal: {}
  mutation_policies:
    transactional:
      mode: transaction-required
      stale_write_protection: sha256
      capture_preimage: true
      rollback_on_partial_failure: true
  review_policies:
    independent-review:
      mode: required
      reviewer:
        independent: true
        allow_author: false
        allow_mutation: false
      max_rounds: 2
      on_timeout: blocked
  queues:
    managed:
      title: Managed work
      capacity: 4
  opportunities: []
  governance:
    strict_validation: true
    reject_unknown_fields: true
    overrides:
      allow_less_restrictive_mutation_policy: false
      allow_review_bypass: false
      allow_scope_expansion_at_runtime: false
    recovery:
      allow_dirty_requeue: false
    derived_opportunities:
      promotion: operator_gate
      max_chain_depth: 12
      max_descendants_per_root: 32
